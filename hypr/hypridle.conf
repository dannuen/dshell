general {
    lock_cmd = pidof hyprlock || qs -c dshell ipc call lock lock
    before_sleep_cmd = qs -c dshell ipc call lock lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# lock after 5 minutes
listener {
    timeout = 300
    on-timeout = qs -c dshell ipc call lock lock
}

# screen off after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
